# Activation: copy this file to .github/workflows/ci.yml using a GitHub token
# with the `workflow` scope. It is kept here so OAuth tokens without that scope
# can still publish the full application and its reproducible CI definition.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app.py config src tests benchmarks
      - name: Run test suite
        run: python -m pytest -q --cov=src --cov=config --cov-report=term-missing
