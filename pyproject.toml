[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ecommerce-analytics"
version = "1.7.0"
description = "Secure AI-powered e-commerce analytics and visualization platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["performance: hardware-sensitive performance checks", "live_llm: requires configured LLM"]
addopts = "-ra"

[tool.coverage.run]
source = ["src", "config"]
omit = ["src/ui/*"]
