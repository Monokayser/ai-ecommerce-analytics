[theme]
primaryColor = "#70DDFF"
backgroundColor = "#03070B"
secondaryBackgroundColor = "#081119"
textColor = "#F4F8FB"
font = "sans serif"

[server]
maxUploadSize = 200
maxMessageSize = 200
headless = true
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = true

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
