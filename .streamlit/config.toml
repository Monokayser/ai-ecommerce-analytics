[theme]
primaryColor = "#39E6BD"
backgroundColor = "#020806"
secondaryBackgroundColor = "#06120E"
textColor = "#F7FBFF"
font = "sans serif"

[server]
maxUploadSize = 200
maxMessageSize = 200
headless = true
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = true

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
